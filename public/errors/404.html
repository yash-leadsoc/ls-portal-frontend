<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 · Page not found — LeadSoC TEDP</title>
<link rel="icon" type="image/png" href="/logo.png?v=2">
<style>
  :root { --navy:#1b2b5e; --cyan:#00a8c8; --muted:#5a6482; --border:#e6eaf2; --bg:#f3f6fb; --tone:#00a8c8; --tone-bg:rgba(0,168,200,.1); }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
         font-family: Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background:var(--bg); color:#1f2937; }
  .card { width:100%; max-width:560px; background:#fff; border:1px solid var(--border); border-radius:18px;
          box-shadow:0 6px 24px rgba(16,26,56,.08); overflow:hidden; }
  .bar { height:4px; background:var(--tone); }
  .body { padding:30px 30px 28px; text-align:center; }
  .logo { width:56px; height:56px; margin:0 auto; border-radius:14px; border:1px solid var(--border); padding:6px; background:#fff; }
  .logo img { width:100%; height:100%; object-fit:contain; display:block; }
  .code { margin-top:18px; font-size:72px; line-height:1; font-weight:800; letter-spacing:4px; color:var(--navy); font-variant-numeric:tabular-nums; }
  .pill { display:inline-block; margin-top:10px; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:700;
          letter-spacing:.4px; text-transform:uppercase; color:var(--tone); background:var(--tone-bg); }
  h1 { margin:14px 0 8px; font-size:22px; color:var(--navy); }
  p { margin:0 auto; max-width:420px; color:var(--muted); font-size:14.5px; line-height:1.6; }
  .actions { display:flex; gap:10px; justify-content:center; margin-top:24px; flex-wrap:wrap; }
  .btn { display:inline-block; padding:10px 18px; border-radius:10px; font-size:14px; font-weight:600; text-decoration:none;
         cursor:pointer; border:1px solid transparent; font-family:inherit; }
  .btn.ghost { background:#fff; color:var(--navy); border-color:var(--border); }
  .btn.cyan { background:var(--cyan); color:#fff; box-shadow:0 6px 16px rgba(0,168,200,.3); }
  .note { margin-top:14px; font-size:12px; color:var(--muted); }
  .foot { border-top:1px solid var(--border); padding:12px 20px; font-size:12px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
  <main class="card" role="main">
    <div class="bar"></div>
    <div class="body">
      <div class="logo"><img src="/logo.png?v=2" alt="LeadSoC"></div>
      <div class="code">404</div>
      <div class="pill">Page problem</div>
      <h1>Page not found</h1>
      <p>The page you are looking for does not exist, was moved, or the link is wrong.</p>
      <div class="actions"><button class="btn ghost" onclick="history.length > 1 ? history.back() : location.assign('/')">&larr; Go back</button><a class="btn cyan" href="/">Go to dashboard</a></div>
    </div>
    <div class="foot">LeadSoC TEDP · If this keeps happening, contact your portal admin.</div>
  </main>
</body>
</html>
