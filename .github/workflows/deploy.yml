name: Frontend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then echo "Set the VITE_API_URL repository variable"; exit 1; fi
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      BUCKET: ${{ vars.WEB_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_FRONTEND_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload hashed assets (long cache)
        run: |
          aws s3 sync dist/assets "s3://${BUCKET}/assets" \
            --cache-control "public, max-age=31536000, immutable" --only-show-errors

      - name: Upload static files (short cache)
        run: |
          aws s3 sync dist "s3://${BUCKET}" \
            --exclude "assets/*" --exclude "index.html" --exclude "sw.js" \
            --cache-control "public, max-age=3600" --only-show-errors

      - name: Upload entry files (no cache)
        run: |
          aws s3 cp dist/sw.js "s3://${BUCKET}/sw.js" \
            --cache-control "no-cache, no-store, must-revalidate" --content-type "application/javascript" --only-show-errors
          aws s3 cp dist/index.html "s3://${BUCKET}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" --content-type "text/html; charset=utf-8" --only-show-errors

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths "/" "/index.html" "/sw.js" --query Invalidation.Id --output text
