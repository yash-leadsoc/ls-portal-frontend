name: Deploy frontend
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        env:
          VITE_API_URL: /api
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -f dist/index.html

      - name: Upload build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: dist/*
          target: /home/ubuntu/app/releases/frontend
          strip_components: 1
          rm: true

      - name: Publish
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            test -f /home/ubuntu/app/releases/frontend/index.html
            sudo rm -rf /var/www/ls-portal.prev
            if [ -d /var/www/ls-portal ]; then sudo cp -a /var/www/ls-portal /var/www/ls-portal.prev; fi
            sudo mkdir -p /var/www/ls-portal
            sudo rsync -a --delete /home/ubuntu/app/releases/frontend/ /var/www/ls-portal/
            sudo chmod -R a+rX /var/www/ls-portal
            echo "Frontend published"
